<svg xmlns="http://www.w3.org/2000/svg" width="420" height="70" viewBox="0 0 420 70" role="img">
  <title>it's not a bug, it's a feature</title>

  <rect x="0.5" y="0.5" width="419" height="69" rx="10" fill="#000000" stroke="#00E5FF" stroke-width="1"/>

  <text x="20" y="42" font-family="JetBrains Mono, monospace" font-size="18" textLength="118" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">it's not a</text>

  <text x="142" y="42" font-family="JetBrains Mono, monospace" font-size="18" textLength="34" lengthAdjust="spacingAndGlyphs" fill="#5c6672">bug</text>
  <line x1="140" y1="36" x2="140" y2="36" stroke="#e0474c" stroke-width="2">
    <animate attributeName="x2" values="140;178;178;178" keyTimes="0;0.3;0.85;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <text x="180" y="42" font-family="JetBrains Mono, monospace" font-size="18" textLength="92" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">, it's a</text>

  <text x="278" y="42" font-family="JetBrains Mono, monospace" font-size="19" font-weight="bold" textLength="118" lengthAdjust="spacingAndGlyphs" fill="#00E5FF" opacity="0">
    feature™
    <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.3;0.45;0.95;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00E5FF;#7dffea;#00E5FF" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
  </text>
</svg>
