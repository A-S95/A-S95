<svg xmlns="http://www.w3.org/2000/svg" width="800" height="4" viewBox="0 0 800 4" preserveAspectRatio="none" role="img">
  <title>animated divider</title>
  <defs>
    <linearGradient id="g" x1="-300" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;800;-300" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1100;0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="4" fill="#0a2e33"/>
  <rect width="800" height="4" fill="url(#g)"/>
</svg>
